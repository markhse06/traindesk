basePath: /
definitions:
  DTO.ChangePasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  DTO.ClientResponse:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      goal:
        type: string
      height:
        type: number
      id:
        type: string
      last_name:
        type: string
      left_sessions:
        type: integer
      total_sessions:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
      weight:
        type: number
    type: object
  DTO.CreateClientRequest:
    properties:
      first_name:
        type: string
      goal:
        type: string
      height:
        type: number
      last_name:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  DTO.CreatePackageRequest:
    properties:
      client_id:
        type: string
      price:
        type: number
      total_count:
        type: integer
      updated_at:
        type: string
    required:
    - client_id
    - total_count
    type: object
  DTO.CreateWorkoutRequest:
    properties:
      client_ids:
        items:
          type: string
        type: array
      date_time:
        type: string
      duration_min:
        type: integer
      notes:
        type: string
      package_id:
        type: string
      price:
        type: number
      type:
        type: string
      updated_at:
        type: string
    type: object
  DTO.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  DTO.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  DTO.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/DTO.RegisterResponse'
    type: object
  DTO.MessageResponse:
    properties:
      message:
        type: string
    type: object
  DTO.ProfileResponse:
    properties:
      email:
        type: string
      id:
        type: string
      trainer_name:
        type: string
    type: object
  DTO.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  DTO.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      trainer_name:
        type: string
    type: object
  DTO.RegisterResponse:
    properties:
      email:
        type: string
      id:
        type: string
      trainer_name:
        type: string
    type: object
  DTO.ReportClientActivity:
    properties:
      client_id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      total_duration_min:
        type: integer
      workout_count:
        type: integer
    type: object
  DTO.ReportSummaryResponse:
    properties:
      active_clients:
        type: integer
      by_client:
        items:
          $ref: '#/definitions/DTO.ReportClientActivity'
        type: array
      by_type:
        items:
          $ref: '#/definitions/DTO.ReportWorkoutTypeSummary'
        type: array
      ended_at:
        type: string
      started_at:
        type: string
      total_duration_min:
        type: integer
      total_revenue:
        type: number
      total_workouts:
        type: integer
    type: object
  DTO.ReportWorkoutTypeSummary:
    properties:
      count:
        type: integer
      total_revenue:
        type: number
      type:
        type: string
    type: object
  DTO.ResetPasswordConfirmRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  DTO.ResetPasswordRequest:
    properties:
      email:
        type: string
    type: object
  DTO.TokenPairResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  DTO.UpdateClientRequest:
    properties:
      first_name:
        type: string
      goal:
        type: string
      height:
        type: number
      last_name:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  DTO.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  DTO.WorkoutResponse:
    properties:
      client_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      datetime:
        type: string
      duration_min:
        type: integer
      id:
        type: string
      notes:
        type: string
      price:
        type: number
      type:
        type: string
      updated_at:
        type: string
    type: object
  domain.WorkoutPackage:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      price:
        type: number
      total_count:
        type: integer
      trainer_id:
        type: string
      updated_at:
        type: string
      used_count:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for trainer account, client, and workout management.
  title: TrainDesk API
  version: "1.0"
paths:
  /api/v1/clients:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/DTO.ClientResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List clients
      tags:
      - clients
    post:
      consumes:
      - application/json
      parameters:
      - description: Client data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DTO.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/DTO.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create client
      tags:
      - clients
  /api/v1/clients/{id}:
    delete:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete client
      tags:
      - clients
    get:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DTO.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get client
      tags:
      - clients
    patch:
      consumes:
      - application/json
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Client data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DTO.UpdateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DTO.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update client
      tags:
      - clients
  /api/v1/packages:
    post:
      consumes:
      - application/json
      parameters:
      - description: Workout package data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DTO.CreatePackageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.WorkoutPackage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create workout package
      tags:
      - workout-packages
  /api/v1/reports/summary:
    get:
      parameters:
      - description: Period start, RFC3339
        in: query
        name: started_at
        type: string
      - description: Period end, RFC3339
        in: query
        name: ended_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DTO.ReportSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Report summary
      tags:
      - reports
  /api/v1/user/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DTO.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DTO.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/DTO.ErrorResponse'
        "500":
